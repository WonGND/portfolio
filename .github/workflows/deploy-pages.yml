# GitHub Pages 자동 배포 워크플로
# main 브랜치에 푸시하면 gh-pages 브랜치로 동기화한다.
# (Pages 소스가 gh-pages 브랜치로 설정되어 있어, 동기화되면 자동으로 사이트에 반영됨)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: main 내용을 gh-pages로 동기화
        run: git push origin HEAD:gh-pages --force
