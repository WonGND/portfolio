<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자기소개서 — 곽원용</title>
<meta name="description" content="곽원용 자기소개서 — 경력 요약, 주요 성과, 이직 사유, 문제 해결·협업 사례, 입사 후 포부.">
<style>
  /* ==========================================================
     자기소개서 페이지 — 본문은 content/cover-letter.md 에서 로드
     글 내용을 고치려면 md 파일만 수정하면 됩니다 (이 파일은 틀).
     ========================================================== */
  :root {
    --bg: #f7f8fa; --surface: #ffffff;
    --text: #1a2233; --text-sub: #55637a; --text-muted: #8a96ab;
    --accent: #1d63d8; --accent-deep: #1450b4; --accent-soft: #e8f0fd;
    --border: #e3e7ee; --tag-bg: #eef1f6;
    --shadow: 0 1px 3px rgba(20,30,55,.06), 0 4px 16px rgba(20,30,55,.05);
    --shadow-lift: 0 4px 10px rgba(20,30,55,.09), 0 12px 32px rgba(20,30,55,.09);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10141c; --surface: #181e29;
      --text: #e6eaf2; --text-sub: #9aa7bd; --text-muted: #6b7891;
      --accent: #6ba3f5; --accent-deep: #8db8f8; --accent-soft: #1c2b45;
      --border: #27303f; --tag-bg: #222a38;
      --shadow: 0 1px 3px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
      --shadow-lift: 0 4px 10px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 24px; }

  nav {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner { display: flex; align-items: center; gap: 8px; height: 56px; }
  .nav-name { font-weight: 800; font-size: 1rem; margin-right: auto; letter-spacing: -.01em; color: var(--text); text-decoration: none; }
  .nav-link {
    font-size: .87rem; font-weight: 600; color: var(--text-sub); text-decoration: none;
    padding: 6px 12px; border-radius: 8px; transition: color .18s, background .18s;
  }
  .nav-link:hover, .nav-link.active { color: var(--accent); background: var(--accent-soft); }

  header { padding: 52px 0 10px; }
  .role-badge {
    display: inline-block; background: var(--accent-soft); color: var(--accent);
    font-size: .82rem; font-weight: 600; padding: 5px 14px; border-radius: 999px;
    margin-bottom: 16px; letter-spacing: .02em;
  }
  h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -.02em; }
  .head-desc { color: var(--text-sub); margin-top: 8px; font-size: .97rem; }
  .head-actions { margin: 20px 0 8px; display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: inherit; font-size: .9rem; font-weight: 700; text-decoration: none;
    padding: 9px 18px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--accent);
    box-shadow: var(--shadow);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); border-color: var(--accent); }
  .btn:active { transform: translateY(0) scale(.97); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .edit-note { font-size: .78rem; color: var(--text-muted); margin-top: 4px; }

  article.card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 36px 40px; box-shadow: var(--shadow);
    margin: 22px 0 60px;
  }
  @media (max-width: 560px) { article.card { padding: 26px 22px; } }

  /* 마크다운 본문 타이포그래피 */
  .md { opacity: 0; transition: opacity .5s ease; }
  .md.loaded { opacity: 1; }
  .md h3 {
    font-size: 1.18rem; font-weight: 800; letter-spacing: -.01em;
    margin: 38px 0 14px; display: flex; align-items: flex-start; gap: 10px;
  }
  .md h3::before {
    content: ""; display: inline-block; flex: 0 0 5px; width: 5px; height: 20px;
    background: var(--accent); border-radius: 3px; margin-top: 6px;
  }
  .md h3:first-child { margin-top: 0; }
  .md h4 { font-size: 1.02rem; font-weight: 700; margin: 24px 0 10px; color: var(--accent-deep); }
  .md p { margin: 0 0 14px; font-size: .97rem; }
  .md strong { font-weight: 700; color: var(--text); }
  .md ul { list-style: none; margin: 0 0 14px; }
  .md li { padding-left: 16px; position: relative; margin-bottom: 6px; font-size: .95rem; }
  .md li::before { content: "·"; position: absolute; left: 3px; color: var(--accent); font-weight: 800; }
  .md blockquote {
    border-left: 3px solid var(--accent); background: var(--accent-soft);
    padding: 10px 16px; border-radius: 0 10px 10px 0; margin: 0 0 14px;
    font-size: .92rem; color: var(--accent-deep);
  }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
  .md .load-error { color: var(--text-sub); font-size: .95rem; }
  .md .load-error a { color: var(--accent); }

  footer {
    border-top: 1px solid var(--border); padding: 30px 0 46px;
    font-size: .85rem; color: var(--text-sub); text-align: center;
  }
  footer a { color: var(--accent); text-decoration: none; }
  .admin-note { font-size: .76rem; color: var(--text-muted); margin-top: 6px; }

  @media print {
    :root {
      --bg: #fff; --surface: #fff; --text: #111; --text-sub: #444; --text-muted: #666;
      --accent: #1d63d8; --accent-deep: #1450b4; --accent-soft: #eef3fb; --border: #ccc;
      --shadow: none; --shadow-lift: none;
    }
    body { font-size: 12px; }
    nav, .head-actions, .edit-note, footer .admin-note { display: none !important; }
    article.card { border: none; padding: 0; margin: 10px 0; box-shadow: none; }
    header { padding: 8px 0 4px; }
    .md { opacity: 1 !important; }
    .md h3 { page-break-after: avoid; }
    @page { size: A4; margin: 15mm; }
  }
</style>
</head>
<body>

<nav>
  <div class="wrap nav-inner">
    <a class="nav-name" href="./">곽원용</a>
    <a class="nav-link" href="./">포트폴리오</a>
    <a class="nav-link active" href="./cover-letter.html">자기소개서</a>
  </div>
</nav>

<div class="wrap">
  <header>
    <span class="role-badge">전장 디스플레이 HW설계 엔지니어 · 4년차</span>
    <h1>자기소개서</h1>
    <p class="head-desc">경력 요약 · 주요 성과 · 이직 사유 · 문제 해결과 협업 · 입사 후 포부, 여섯 가지 질문으로 정리했습니다.</p>
    <div class="head-actions">
      <button class="btn btn-primary" onclick="window.print()">🖨 PDF로 저장</button>
      <a class="btn" id="edit-btn" href="#" target="_blank" rel="noopener">✏️ 내용 수정</a>
    </div>
    <p class="edit-note">수정 버튼은 GitHub 편집 화면을 엽니다. 저장(커밋)은 저장소 소유자 본인만 가능합니다.</p>
  </header>

  <article class="card">
    <div class="md" id="content"><p class="load-error">불러오는 중…</p></div>
  </article>
</div>

<footer>
  <div class="wrap">
    곽원용 · <a href="mailto:kkwy1026@naver.com">kkwy1026@naver.com</a> · <a href="./">포트폴리오로 돌아가기</a>
    <div class="admin-note">본문 수정: <span id="admin-path">content/cover-letter.md</span> (저장소 소유자 전용)</div>
  </div>
</footer>

<script>
(function () {
  "use strict";

  /* ============================================================
     [수정 포인트] 저장소 이름이나 URL을 바꾸면 아래 REPO만 고치세요.
     (사이트 내부 링크는 전부 상대경로라 함께 옮겨집니다)
     ============================================================ */
  var REPO = "WonGND/portfolio";
  var BRANCH = "main";
  var MD_PATH = "content/cover-letter.md";

  document.getElementById("edit-btn").href =
    "https://github.com/" + REPO + "/edit/" + BRANCH + "/" + MD_PATH;

  /* ---------- 초소형 마크다운 렌더러 (제목/굵게/목록/인용/구분선) ---------- */
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function inline(s) {
    return esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function renderMD(md) {
    md = md.replace(/<!--[\s\S]*?-->/g, ""); /* 주석은 표시하지 않음 */
    var out = [], para = [], inList = false;
    function flushPara() { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } }
    function closeList() { if (inList) { out.push("</ul>"); inList = false; } }
    md.split(/\r?\n/).forEach(function (raw) {
      var t = raw.trim(), m;
      if (!t) { flushPara(); closeList(); return; }
      if ((m = t.match(/^(#{1,3})\s+(.*)$/))) {
        flushPara(); closeList();
        var lv = m[1].length + 1; /* 페이지 h1 아래로 한 단계씩 내림 */
        out.push("<h" + lv + ">" + inline(m[2]) + "</h" + lv + ">");
        return;
      }
      if (/^-{3,}$/.test(t)) { flushPara(); closeList(); out.push("<hr>"); return; }
      if ((m = t.match(/^-\s+(.*)$/))) {
        flushPara();
        if (!inList) { out.push("<ul>"); inList = true; }
        out.push("<li>" + inline(m[1]) + "</li>");
        return;
      }
      if ((m = t.match(/^>\s?(.*)$/))) { flushPara(); closeList(); out.push("<blockquote>" + inline(m[1]) + "</blockquote>"); return; }
      para.push(t);
    });
    flushPara(); closeList();
    return out.join("\n");
  }

  var box = document.getElementById("content");
  fetch("./" + MD_PATH, { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (md) {
      box.innerHTML = renderMD(md);
      box.classList.add("loaded");
    })
    .catch(function () {
      box.innerHTML =
        '<p class="load-error">본문을 불러오지 못했습니다. ' +
        '<a href="https://github.com/' + REPO + '/blob/' + BRANCH + '/' + MD_PATH + '" target="_blank" rel="noopener">GitHub에서 원문 보기</a></p>';
      box.classList.add("loaded");
    });
})();
</script>

</body>
</html>
